<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img">
<title>投机解码：验收、补分布与加速</title>
<rect width="760" height="360" rx="20" fill="#080e1b"/>
<g font-family="system-ui, sans-serif">
<text x="26" y="43" fill="#f0f5ff" font-size="25" font-weight="700">投机解码：验收、补分布与加速</text>
<rect x="26" y="64" width="348" height="79" rx="10" fill="#142339" stroke="#365467"/>
<rect x="26" y="64" width="348" height="79" rx="10" fill="none" stroke="#7ce7ff" stroke-width="2" opacity="0"><animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.166667;0.333333;0.5;0.666667;0.833333;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></rect>
<text x="40" y="95" fill="#f0f5ff" font-size="19">01 · 同前缀比较分布</text>
<text x="40" y="123" fill="#b1c2d7" font-size="13">草稿提出 A，目标也给 A 非零概率</text>
<rect x="386" y="64" width="348" height="79" rx="10" fill="#142339" stroke="#365467"/>
<rect x="386" y="64" width="348" height="79" rx="10" fill="none" stroke="#7ce7ff" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.166667;0.333333;0.5;0.666667;0.833333;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></rect>
<text x="400" y="95" fill="#f0f5ff" font-size="19">02 · 验收概率</text>
<text x="400" y="123" fill="#b1c2d7" font-size="13">得到 0.75</text>
<rect x="26" y="158" width="348" height="79" rx="10" fill="#142339" stroke="#365467"/>
<rect x="26" y="158" width="348" height="79" rx="10" fill="none" stroke="#7ce7ff" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.166667;0.333333;0.5;0.666667;0.833333;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></rect>
<text x="40" y="189" fill="#f0f5ff" font-size="19">03 · 拒绝后补分布</text>
<text x="40" y="217" fill="#b1c2d7" font-size="13">取正部 (0,0.2)，归一化</text>
<rect x="386" y="158" width="348" height="79" rx="10" fill="#142339" stroke="#365467"/>
<rect x="386" y="158" width="348" height="79" rx="10" fill="none" stroke="#7ce7ff" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.166667;0.333333;0.5;0.666667;0.833333;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></rect>
<text x="400" y="189" fill="#f0f5ff" font-size="19">04 · 检查输出分布</text>
<text x="400" y="217" fill="#b1c2d7" font-size="13">接受 B 的质量 0.2，加上拒绝修正的 0.2</text>
<rect x="26" y="252" width="348" height="79" rx="10" fill="#142339" stroke="#365467"/>
<rect x="26" y="252" width="348" height="79" rx="10" fill="none" stroke="#7ce7ff" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.166667;0.333333;0.5;0.666667;0.833333;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></rect>
<text x="40" y="283" fill="#f0f5ff" font-size="19">05 · 草稿全通过</text>
<text x="40" y="311" fill="#b1c2d7" font-size="13">目标模型已有下一位置的条件分布</text>
<rect x="386" y="252" width="348" height="79" rx="10" fill="#142339" stroke="#365467"/>
<rect x="386" y="252" width="348" height="79" rx="10" fill="none" stroke="#7ce7ff" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.166667;0.333333;0.5;0.666667;0.833333;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></rect>
<text x="400" y="283" fill="#f0f5ff" font-size="19">06 · 加速条件</text>
<text x="400" y="311" fill="#b1c2d7" font-size="13">模型化期望产出 1+0.8+0.64+0.512=2.952</text>
</g>
</svg>
